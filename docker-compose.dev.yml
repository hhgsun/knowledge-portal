services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kp-backend-dev
    volumes:
      - backend-data-dev:/app/data
    ports:
      - "5174:5174"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kp-frontend-dev
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data-dev:
