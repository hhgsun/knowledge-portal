groups:
  - name: knowledge-portal-rag
    rules:
      - alert: KnowledgePortalRagFailures
        expr: increase(kp_rag_failures_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Knowledge Portal RAG failures are elevated"
      - alert: KnowledgePortalRagBusy
        expr: increase(kp_rag_requests_total{outcome="busy"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Knowledge Portal RAG capacity is saturated"
      - alert: KnowledgePortalRagP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(kp_rag_duration_ms_milliseconds_bucket[10m]))) > 30000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Knowledge Portal RAG p95 latency exceeds 30 seconds"
      - alert: KnowledgePortalEmbeddingBacklog
        expr: kp_pending_embeddings > 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Knowledge Portal embedding backlog is growing"
      - alert: KnowledgePortalAssistantP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(kp_assistant_duration_ms_milliseconds_bucket[10m]))) > 30000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Knowledge Portal Assistant p95 latency exceeds 30 seconds"
      - alert: KnowledgePortalAssistantClassifierDegraded
        expr: sum(rate(kp_assistant_classifier_requests_total{outcome=~"failure|timeout|busy|circuit_open"}[10m])) / clamp_min(sum(rate(kp_assistant_classifier_requests_total[10m])), 0.000001) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Knowledge Portal Assistant classifier degradation exceeds 20%"
      - alert: KnowledgePortalAssistantAuditFailure
        expr: increase(kp_assistant_audit_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Knowledge Portal Assistant privacy-safe audit persistence failed"
      - alert: KnowledgePortalAssistantShadowDisagreement
        expr: sum(increase(kp_assistant_shadow_comparisons_total{outcome="disagree"}[1h])) / clamp_min(sum(increase(kp_assistant_shadow_comparisons_total{outcome=~"agree|disagree"}[1h])), 1) > 0.2 and sum(increase(kp_assistant_shadow_comparisons_total{outcome=~"agree|disagree"}[1h])) >= 20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Knowledge Portal Assistant shadow routing disagreement exceeds 20%"
