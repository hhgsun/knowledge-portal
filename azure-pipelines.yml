trigger:
  branches:
    include:
      - dev
      - test

variables:
  dockerRegistryServiceConnection: 'acr-service-connection'
  containerRegistry: 'yourregistry.azurecr.io'
  backendImageRepository: 'knowledge-portal/backend'
  frontendImageRepository: 'knowledge-portal/frontend'
  tag: '$(Build.BuildId)'

  # Branch → Environment mapping
  ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
    environment: 'dev'
    backendDockerfilePath: 'backend/Dockerfile.dev'
    frontendDockerfilePath: 'frontend/Dockerfile.dev'
    composeFile: 'docker-compose.dev.yml'
  ${{ if eq(variables['Build.SourceBranchName'], 'test') }}:
    environment: 'test'
    backendDockerfilePath: 'backend/Dockerfile.test'
    frontendDockerfilePath: 'frontend/Dockerfile.test'
    composeFile: 'docker-compose.test.yml'

stages:
  - stage: Test
    displayName: 'Run Backend Tests'
    jobs:
      - job: BackendTests
        displayName: 'Backend Tests (xUnit + EF InMemory)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '10.0.x'

          - script: dotnet test backend/Tests/KnowledgePortal.Api.Tests.csproj --logger trx --results-directory $(Agent.TempDirectory)/testresults
            displayName: 'dotnet test'

          - script: dotnet test backend/Tests/KnowledgePortal.Api.Tests.csproj --no-build --filter "Gate=McpConformance|Gate=McpSchema|Gate=GoldenRetrieval|Gate=DataIsolation|Gate=McpSecurity|Gate=McpConcurrency" --logger "trx;LogFileName=mcp-quality-gates.trx" --results-directory $(Agent.TempDirectory)/testresults
            displayName: 'MCP quality gates'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/testresults/**/*.trx'

  - stage: Build
    displayName: 'Build & Push Images'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: BuildBackend
        displayName: 'Build Backend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build and push backend image'
            inputs:
              command: buildAndPush
              repository: $(backendImageRepository)
              dockerfile: $(backendDockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              buildContext: 'backend'
              tags: |
                $(tag)
                $(environment)-latest

      - job: BuildFrontend
        displayName: 'Build Frontend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build and push frontend image'
            inputs:
              command: buildAndPush
              repository: $(frontendImageRepository)
              dockerfile: $(frontendDockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              buildContext: 'frontend'
              tags: |
                $(tag)
                $(environment)-latest

  - stage: Deploy
    displayName: 'Deploy to $(environment)'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToServer
        displayName: 'Deploy to $(environment) server'
        pool:
          vmImage: 'ubuntu-latest'
        environment: $(environment)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: CopyFilesOverSSH@0
                  displayName: 'Copy compose file to server'
                  inputs:
                    sshEndpoint: '$(environment)-server-ssh'
                    sourceFolder: '$(Build.SourcesDirectory)'
                    contents: '$(composeFile)'
                    targetFolder: '/opt/knowledge-portal'

                - task: SSH@0
                  displayName: 'Pull and restart containers'
                  inputs:
                    sshEndpoint: '$(environment)-server-ssh'
                    runOptions: 'inline'
                    inline: |
                      cd /opt/knowledge-portal

                      # Login to ACR
                      echo $(ACR_PASSWORD) | docker login $(containerRegistry) -u $(ACR_USERNAME) --password-stdin

                      # Pull latest images
                      docker pull $(containerRegistry)/$(backendImageRepository):$(environment)-latest
                      docker pull $(containerRegistry)/$(frontendImageRepository):$(environment)-latest

                      # Tag for compose
                      docker tag $(containerRegistry)/$(backendImageRepository):$(environment)-latest kp-backend:latest
                      docker tag $(containerRegistry)/$(frontendImageRepository):$(environment)-latest kp-frontend:latest

                      # Restart services
                      docker compose -f $(composeFile) up -d

                      # Cleanup
                      docker image prune -f

                - task: SSH@0
                  displayName: 'Health check'
                  inputs:
                    sshEndpoint: '$(environment)-server-ssh'
                    runOptions: 'inline'
                    inline: |
                      sleep 10
                      curl -sf http://localhost:5174/api/health || exit 1
                      echo "✓ Health check passed for $(environment)"
